<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Contar caracteres</title>
    <script>
        var termo = "AprenDendO JavaSCRipt";
        // exibir quantidade de caracteres
        alert(termo.length);
        
        //Maiúscula
        alert(termo.toUpperCase());

        //Minúscula
        alert(termo.toLowerCase());

        //retornar a primeira letra O
        alert(termo.indexOf("O"));

        //retornar a últimal letra E
        alert(termo.lastIndexOf("e"));

        //extrair elementos, onde começa
        alert(termo.slice(10));

        //extrair elementos, onde começa e termina
        alert(termo.slice(10,15));

        //arredondar valores
        var notaa = 11.89;

        //exibir a nota formatada
        //arredonda o valor para cima ou para baixo a depender do valor mais próximo
        alert(Math.round(notaa));


        //Obter o menor valor
        alert(Math.min(-10,2,1,6,7));
        
        //Obter o maior valor
        alert(Math.max(5,-7,10,100));

        alert(Math.random(nmr));
