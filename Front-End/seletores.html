<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //variavel
        function acao() {
            for(var i=0; i<3; i++) {
                var texto = document.getElementsByTagName("h1")[i];
                //exibir o conteudo do h1
                alert(texto.innerHTML);
            }
        }
        function acao2() {
            var texto = document.getElementsByTagName("h1")[0];
                //exibir o conteudo do h1
                alert(texto.innerHTML);
        }
    </script>
</head>
<body>

    <button onclick="acao2()">Selecionar</button>

    <h1>Proway</h1>
    <h1>Seletores JS</h1>
    <h1>Curso Proway</h1>
</body>
</html>
